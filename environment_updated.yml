name: dynavelo
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.10
  - pip
  - numpy=1.23
  - scipy=1.10
  - pandas=1.5
  - scikit-learn=1.0
  - statsmodels
  - numba
  - leidenalg=0.8
  - matplotlib
  - seaborn
  - ipykernel
  - tqdm
  - mkl
  - intel-openmp
  - pip:
    - --extra-index-url https://download.pytorch.org/whl/cu118
    - torch
    - torchvision
    - anndata==0.10.2
    - scanpy==1.9.5
    - scvelo==0.2.4
    - multivelo==0.1.2
    - torchdiffeq==0.2.3
    - torchmetrics==0.11.1
    - pygpcca==1.0.4
    - bbknn==1.6.0
    - harmonypy==0.0.9
    - loompy==3.0.7
    - scikit-misc==0.3.0
    - adjustText==1.2.0